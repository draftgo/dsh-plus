name: DSH-Plus Android package
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to receive the APK
        required: true
        default: v0.1.2
      publish:
        description: Publish the verified APK to the release
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  package:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plugins/link/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Link dependencies
        run: npm ci --prefix plugins/link
      - name: Build Android debug package
        run: npm run build:android
      - name: Verify package metadata
        shell: bash
        run: |
          test -f plugins/link/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          version=$(node -p "JSON.parse(require('fs').readFileSync('plugins/commander/package.json','utf8')).version")
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging plugins/link/mobile/android/app/build/outputs/apk/debug/app-debug.apk | grep "versionName='$version'"
          cp plugins/link/mobile/android/app/build/outputs/apk/debug/app-debug.apk "dsh-plus-${version}-android-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-plus-android-debug
          path: dsh-plus-*-android-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish verified Android APK
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "JSON.parse(require('fs').readFileSync('plugins/commander/package.json','utf8')).version")
          test "$RELEASE_TAG" = "v${version}"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "DSH-Plus ${version}" --notes "DSH-Plus application release with Xiaojiao branding and independent plugin updates. Android APK is a debug build for device testing." --latest=false
          fi
          gh release upload "$RELEASE_TAG" "dsh-plus-${version}-android-debug.apk" --clobber
