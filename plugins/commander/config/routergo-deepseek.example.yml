# Merge this provider/model declaration with the existing llm-pi-ai profile.
# The credential stays in the credential store or environment, never this file.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      routergo:
        displayName: RouterGo
        api: openai-completions
        baseURL: https://routergo.cn/api/v1
        apiKeyEnv: ROUTERGO_API_KEY
        models:
          - id: deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash
            input: [text]
            reasoningEfforts:
              off: null
              high: high
            compat:
              thinkingFormat: deepseek
              supportsReasoningEffort: true
              maxTokensField: max_tokens
              supportsDeveloperRole: false
              supportsStore: false
              requiresReasoningContentOnAssistantMessages: true
