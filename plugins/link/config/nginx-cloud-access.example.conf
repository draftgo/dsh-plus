# Include INSIDE the existing HTTPS server, before its application locations.
# Requires ngx_http_auth_request_module. Replace cloud.example.com and 48722.
# Harness env: DSH_LINK_CLOUD_ORIGIN=https://cloud.example.com
#              DSH_LINK_CLOUD_AUTH_PORT=48722
# Keep Harness and this auth port loopback-only; do not publish alternate ingress.
# All inheriting locations are covered: /, /api/, stream/WS, plugin resources,
# /mobile preview. The two /link/ locations in nginx.example.conf explicitly
# delegate authentication to the separate device-only Link TLS carrier.
# Never exempt owner /, /api/, resources or bootstrap locations.
# Existing allow all locations still require auth because satisfy stays all.
satisfy all;
recursive_error_pages on;
auth_request /__dsh_access/check;
auth_request_set $dsh_cloud_status $upstream_status;
error_page 401 = @dsh_cloud_unauthorized;

location = /__dsh_access/check {
    internal;
    allow all;
    auth_request off;
    proxy_pass http://127.0.0.1:48722/__dsh_access/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host cloud.example.com;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    access_log off;
}
location = /__dsh_access/login {
    allow all;
    auth_request off;
    proxy_pass http://127.0.0.1:48722;
    proxy_set_header Host cloud.example.com;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_intercept_errors off;
    access_log off;
}
location = /__dsh_access/session {
    allow all;
    auth_request off;
    proxy_pass http://127.0.0.1:48722;
    proxy_set_header Host cloud.example.com;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_intercept_errors off;
    client_max_body_size 4k;
    client_body_timeout 10s;
    access_log off;
}
location @dsh_cloud_unauthorized {
    auth_request off;
    default_type application/json;
    add_header Cache-Control no-store always;
    # An API/stream/resource URL always stays 401, even with a forged navigation
    # header; original official owner bootstrap remains separately guarded.
    if ($request_uri ~ "(?:^|/)(?:api|remote|socket|gateway|stream|plugins|assets)(?:/|\?|$)") {
        return 401 '{"error":"需要云端访问密钥登录","code":"CLOUD_ACCESS_REQUIRED"}';
    }
    if ($request_uri ~ "\.(?:js|css|json|svg|png|ico)(?:\?|$)") {
        return 401 '{"error":"需要云端访问密钥登录","code":"CLOUD_ACCESS_REQUIRED"}';
    }
    # Only real document navigation gets HTML. fetch/API/stream/WS stay 401.
    if ($http_sec_fetch_mode = navigate) {
        return 303 /__dsh_access/login?next=$request_uri;
    }
    return 401 '{"error":"需要云端访问密钥登录","code":"CLOUD_ACCESS_REQUIRED"}';
}

# Preserve official owner launch-token bootstrap only AFTER cloud auth passed.
# If /= uses error_page 401 = @dsh_bootstrap, keep that root route and ADD these
# include FIRST inside the EXISTING @dsh_bootstrap location, before its current
# private launch-token injection and proxy_pass directives:
#   include /absolute/path/nginx-cloud-bootstrap.example.conf;
# Keep the existing auth_request inheritance and owner proxy bridge unchanged.
# This transfers cloud-auth failures into the login/JSON handler; the private
# owner bootstrap runs only on cloud status 204 and cannot issue an owner token
# to an anonymous visitor. Guard any other owner bootstrap locations the same.
# API locations must not bootstrap owner tokens or redirect 401 to HTML.
# Auth upstream failure produces 500, so access fails closed.
