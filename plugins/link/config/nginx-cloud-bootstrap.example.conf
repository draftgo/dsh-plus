# Include FIRST inside your EXISTING @dsh_bootstrap named location.
# Keep its private owner launch-token injection/proxy directives after this.
# 418 is internal error routing only; clients receive the login redirect or 401.
# Server include enables recursive_error_pages before the initial 401 occurs.
error_page 418 = @dsh_cloud_unauthorized;
if ($dsh_cloud_status != 204) { return 418; }
