# Harness env: DSH_LINK_DEVICE_GATEWAY_PORT=48723
# DSH_LINK_WORKBENCH_ORIGIN=https://workbench.example.com
# Requires existing DSH_LINK_CLOUD_ORIGIN/auth and separate workbench DNS/TLS.
# INSIDE owner HTTPS server; inherit existing IP and owner auth_request rules.
# Never add auth_request off here or put this route under public /link/.
# At owner server scope, reject a supplied foreign Origin BEFORE owner APIs:
# if ($http_origin ~ "^(?!https://cloud[.]example[.]com$).+") { return 403; }
# Mandatory especially if workbench uses the same hostname on another port:
# cookies are host scoped, not port scoped. Keep owner cookies HttpOnly.
location ^~ /devices/ {
    proxy_pass http://127.0.0.1:48723;
    proxy_set_header Host cloud.example.com;
    proxy_set_header Origin $http_origin;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 128k;
    proxy_read_timeout 120s;
    access_log off;
}

