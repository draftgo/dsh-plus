# Place inside your existing HTTPS server block.
# Set Link listening host to 127.0.0.1 for a cloud-only deployment.
# Replace the port/path with the settings displayed by your desktop.
location = /link/workbench/api/voice/realtime {
    # Device-authenticated Link carrier only; owner routes keep cloud auth.
    auth_request off;
    proxy_pass https://127.0.0.1:48721;
    # Link validates the paired-device cookie before upgrading this socket.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header Origin $http_origin;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /absolute/commander-data/link/host-cert.pem;
    proxy_ssl_server_name on;
    proxy_ssl_name localhost;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    client_max_body_size 256k;
    client_body_timeout 60s;
    proxy_hide_header X-Powered-By;
}

location ^~ /link/ {
    # Pairing requires a short-lived code and explicit host approval. Workbench
    # APIs require Link's device token/cookie; this is NOT the owner backend.
    # Do not copy this exemption to /, /api/, /mobile or owner bootstrap routes.
    auth_request off;
    proxy_pass https://127.0.0.1:48721;
    # Link carries NDJSON responses and request bodies over long-lived HTTP/1.1.
    # Disable both sides of proxy buffering so ready/heartbeat frames reach the
    # browser immediately and uplink frames are not held in Nginx temp files.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header Origin $http_origin;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /absolute/commander-data/link/host-cert.pem;
    proxy_ssl_server_name on;
    proxy_ssl_name localhost;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    client_max_body_size 256k;
    client_body_timeout 60s;
    proxy_hide_header X-Powered-By;
}
