<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
    <title>小角</title>
    <link rel="stylesheet" href="dsh-plus-startup.css">
    <script src="dsh-plus-startup.js" defer></script>
  </head>
  <body>
    <div class="drag-region" aria-hidden="true"></div>
    <main>
      <div class="startup-brand">
        <img class="startup-mascot" src="assets/dsh-plus-logo.png" alt="小角" width="72" height="72">
        <h1>小角</h1>
      </div>
      <span class="startup-engine">DeepSeek</span>
      <div class="startup-loading" aria-hidden="true"></div>
      <p id="startup-status" role="status" aria-live="polite">正在准备工作台…</p>
      <button id="startup-retry" type="button" hidden>重试</button>
    </main>
  </body>
</html>
